name: Render SEPs

on:
  push:
    branches:
      - main
    paths:
      - "seps/**/*.md"
      - "scripts/render-seps.ts"
      - "docs/seps/**"
      - "docs/docs.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-seps.yml"

  pull_request:
    paths:
      - "seps/**/*.md"
      - "scripts/render-seps.ts"
      - "docs/seps/**"
      - "docs/docs.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-seps.yml"

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-seps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify SEPs are up to date
        run: npm run check:seps
