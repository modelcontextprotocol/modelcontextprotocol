name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# New PR events cancel the previous preview run.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate source and generate website
        run: |
          npm run check:schema:json
          npm run check:docs:format
          npm run generate
          npm run check
      - name: Copy website with skill files included
        run: cp -RL docs "$RUNNER_TEMP/generated-docs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-preview
          path: ${{ runner.temp }}/generated-docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_BRANCH: docs-pr-${{ github.event.pull_request.number }}
      MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
      MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs-preview
          path: ${{ runner.temp }}/generated-docs/
      - name: Commit generated website to its preview branch
        working-directory: publisher
        run: |
          : "${MINTLIFY_API_KEY:?Configure MINTLIFY_API_KEY before enabling previews}"
          : "${MINTLIFY_PROJECT_ID:?Configure MINTLIFY_PROJECT_ID before enabling previews}"
          test -s "$RUNNER_TEMP/generated-docs/docs.json"
          preview_ref=$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH")
          if [ -n "$preview_ref" ]; then
            git fetch --depth=1 origin "$PREVIEW_BRANCH"
            git checkout -B "$PREVIEW_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$PREVIEW_BRANCH"
          fi
          # Replace only this disposable checkout; never execute generated files.
          git rm -rf .
          cp -R "$RUNNER_TEMP/generated-docs" docs
          git add docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "docs: preview PR #$PR_NUMBER ($SOURCE_SHA)"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
      - name: Request Mintlify preview and share its URL
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const response = await fetch(
              `https://api.mintlify.com/v1/project/preview/${encodeURIComponent(process.env.MINTLIFY_PROJECT_ID)}`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.MINTLIFY_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ branch: process.env.PREVIEW_BRANCH }),
                signal: AbortSignal.timeout(60000),
              },
            );
            if (!response.ok) throw new Error(`Mintlify preview request failed: HTTP ${response.status}`);
            const { previewUrl } = await response.json();
            if (new URL(previewUrl).protocol !== 'https:') throw new Error('Invalid Mintlify preview URL');

            // Keep one comment per PR, updating the link and source revision.
            const marker = '<!-- generated-docs-preview -->';
            const body = `${marker}\n[Generated docs preview](${previewUrl}) for ${process.env.SOURCE_SHA}.\n\nDeployment requested; the preview may take a few minutes to update.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete generated preview branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: `heads/docs-pr-${context.issue.number}`,
              });
              await github.rest.git.deleteRef({
                ...context.repo, ref: `heads/docs-pr-${context.issue.number}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
