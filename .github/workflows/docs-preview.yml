name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# New PR events cancel the previous preview run.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_BRANCH: docs-pr-${{ github.event.pull_request.number }}

jobs:
  build:
    name: Build and commit
    permissions:
      contents: write
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate source and generate website
        run: |
          npm run check:schema:json
          npm run check:docs:format
          npm run generate
          npm run check
      - name: Commit generated website to its preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s "$GITHUB_WORKSPACE/docs/docs.json"
          # Use a separate Git directory so only generated docs are committed.
          git init --initial-branch="$PREVIEW_BRANCH" "$RUNNER_TEMP/docs-preview-publisher"
          cd "$RUNNER_TEMP/docs-preview-publisher"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config credential.helper '!gh auth git-credential'
          preview_ref=$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH")
          if [ -n "$preview_ref" ]; then
            git fetch --depth=1 origin "$PREVIEW_BRANCH"
            git checkout -B "$PREVIEW_BRANCH" FETCH_HEAD
            git rm -rf .
          fi
          # Dereference skills so the published files do not depend on source paths.
          cp -RL "$GITHUB_WORKSPACE/docs" docs
          git add docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "docs: preview PR #$PR_NUMBER ($SOURCE_SHA)"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    env:
      MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
      MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
    steps:
      - name: Request Mintlify preview and share its URL
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (!process.env.MINTLIFY_API_KEY || !process.env.MINTLIFY_PROJECT_ID) {
              throw new Error('Configure MINTLIFY_API_KEY and MINTLIFY_PROJECT_ID before enabling previews.');
            }
            const response = await fetch(
              `https://api.mintlify.com/v1/project/preview/${encodeURIComponent(process.env.MINTLIFY_PROJECT_ID)}`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.MINTLIFY_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ branch: process.env.PREVIEW_BRANCH }),
                signal: AbortSignal.timeout(60000),
              },
            );
            if (!response.ok) throw new Error(`Mintlify preview request failed: HTTP ${response.status}`);
            const { previewUrl } = await response.json();
            if (new URL(previewUrl).protocol !== 'https:') throw new Error('Invalid Mintlify preview URL');

            // Keep one comment per PR, updating the link and source revision.
            const marker = '<!-- generated-docs-preview -->';
            const body = `${marker}\n[Generated docs preview](${previewUrl}) for ${process.env.SOURCE_SHA}.\n\nDeployment requested; the preview may take a few minutes to update.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete generated preview branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            try {
              await github.rest.git.getRef({
                ...context.repo, ref: `heads/${process.env.PREVIEW_BRANCH}`,
              });
              await github.rest.git.deleteRef({
                ...context.repo, ref: `heads/${process.env.PREVIEW_BRANCH}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
