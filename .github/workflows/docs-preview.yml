name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# New PR events cancel the previous preview run.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_BRANCH: docs-pr-${{ github.event.pull_request.number }}

jobs:
  build:
    name: Build and commit
    permissions:
      contents: write
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate source and generate website
        run: |
          npm run check:schema:json
          npm run check:docs:format
          npm run generate
          npm run check
      - name: Commit and push preview docs
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ env.PREVIEW_BRANCH }}
          publish_dir: docs
          destination_dir: docs
          allow_empty_commit: true
          full_commit_message: "docs: preview PR #${{ env.PR_NUMBER }} (${{ env.SOURCE_SHA }})"

  deploy:
    name: Deploy preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Request Mintlify preview
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
        with:
          script: |
            if (!process.env.MINTLIFY_API_KEY || !process.env.MINTLIFY_PROJECT_ID) {
              throw new Error('Configure MINTLIFY_API_KEY and MINTLIFY_PROJECT_ID before enabling previews.');
            }
            const response = await fetch(
              `https://api.mintlify.com/v1/project/preview/${encodeURIComponent(process.env.MINTLIFY_PROJECT_ID)}`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.MINTLIFY_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ branch: process.env.PREVIEW_BRANCH }),
                signal: AbortSignal.timeout(60000),
              },
            );
            if (!response.ok) throw new Error(`Mintlify preview request failed: HTTP ${response.status}`);
            const { previewUrl, statusId } = await response.json();
            if (new URL(previewUrl).protocol !== 'https:') throw new Error('Invalid Mintlify preview URL');
            if (!statusId) throw new Error('Missing Mintlify deployment status ID');
            core.setOutput('preview_url', previewUrl);
            core.setOutput('status_id', statusId);

      - name: Update PR preview comment
        id: comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        with:
          script: |
            // Keep one comment per PR, updating the link and source revision.
            const marker = '<!-- generated-docs-preview -->';
            const body = `${marker}\n| Status | Preview | Commit |\n| ------ | ------- | ------ |\n| Deploying | [View preview](${process.env.PREVIEW_URL}) | ${process.env.SOURCE_SHA} |\n\n[Workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            const { data: comment } = existing
              ? await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            core.setOutput('comment_id', comment.id);
            core.setOutput('body', body);

      - name: Wait for Mintlify deployment
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          STATUS_ID: ${{ steps.preview.outputs.status_id }}
        with:
          script: |
            // Poll this deployment for up to five minutes, leaving time to update the comment.
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await fetch(
                `https://api.mintlify.com/v1/project/update-status/${encodeURIComponent(process.env.STATUS_ID)}`,
                {
                  headers: { Authorization: `Bearer ${process.env.MINTLIFY_API_KEY}` },
                  signal: AbortSignal.timeout(10000),
                },
              );
              if (!response.ok) throw new Error(`Mintlify status request failed: HTTP ${response.status}`);
              const { status } = await response.json();
              if (status === 'success') {
                core.setOutput('status', 'Ready');
                return;
              }
              if (status === 'failure') {
                core.setOutput('status', 'Failed');
                core.setFailed('Mintlify preview deployment failed.');
                return;
              }
              if (!['queued', 'in_progress'].includes(status)) throw new Error(`Unexpected Mintlify status: ${status}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setOutput('status', 'Timed out');
            core.setFailed('Mintlify preview was not ready within five minutes.');

      - name: Update PR preview status
        if: ${{ !cancelled() && steps.comment.outcome == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COMMENT_ID: ${{ steps.comment.outputs.comment_id }}
          COMMENT_BODY: ${{ steps.comment.outputs.body }}
          PREVIEW_STATUS: ${{ steps.deployment.outputs.status || 'Status unavailable' }}
        with:
          script: |
            // Update the same comment even when deployment fails or times out.
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body: process.env.COMMENT_BODY.replace('| Deploying |', `| ${process.env.PREVIEW_STATUS} |`),
            });

  cleanup:
    if: >-
      vars.DOCS_PREVIEWS_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete generated preview branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$PREVIEW_BRANCH"
