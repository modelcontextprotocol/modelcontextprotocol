<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="640" viewBox="0 0 1760 640" role="img" aria-labelledby="title description">
  <title id="title">Example MCP release cycle timeline</title>
  <desc id="description">A March release and a September release on one month axis. Each cycle runs eight months: two months of planning, Core Maintainer review until soft freeze two and a half months before release, then hard freeze one month before release. Tier 1 SDK betas are marked a month and a half before each release. September planning overlaps the last two months of the March cycle, and the releases are six months apart.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c2429; }
      .month { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; fill: #5b6b74; text-anchor: middle; }
      .row-label { font-size: 16px; fill: #5b6b74; dominant-baseline: central; }
      .row-name { font-size: 27px; font-weight: 600; dominant-baseline: central; }
      .phase { font-size: 22px; text-anchor: middle; dominant-baseline: central; }
      .sdk-label { font-size: 18px; font-weight: 600; fill: #2d4b5a; text-anchor: middle; }
      .dimension { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 18px; fill: #3e5866; text-anchor: middle; }
    </style>
    <pattern id="tape" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#c9a543"/>
      <rect width="10" height="20" fill="#ffffff"/>
    </pattern>
    <g id="freeze">
      <rect width="144" height="76" fill="#f7f2e3" stroke="#a8904a"/>
      <rect x="144" width="96" height="76" fill="#efe5c8" stroke="#a8904a"/>
      <rect y="68" width="240" height="8" fill="url(#tape)"/>
      <g font-size="20" text-anchor="middle" dominant-baseline="central">
        <text x="72" y="23">Soft</text>
        <text x="72" y="45">freeze</text>
        <text x="192" y="23">Hard</text>
        <text x="192" y="45">freeze</text>
      </g>
      <path d="M96 -18V-6" stroke="#2d4b5a" stroke-width="1.5"/>
      <path d="M96 -6L102 0L96 6L90 0Z" fill="#ffffff" stroke="#2d4b5a" stroke-width="2"/>
      <text class="sdk-label" x="96" y="-28">Tier 1 SDK betas</text>
      <circle cx="240" cy="38" r="6" fill="#ffffff" stroke="#1c2429" stroke-width="2"/>
      <text x="258" y="45" font-size="19">Release</text>
    </g>
    <marker id="dimension-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#6f8b98"/>
    </marker>
  </defs>

  <rect width="1760" height="640" fill="#ffffff"/>

  <g class="month">
    <text x="280" y="81">Jul</text>
    <text x="376" y="81">Aug</text>
    <text x="472" y="81">Sep</text>
    <text x="568" y="81">Oct</text>
    <text x="664" y="81">Nov</text>
    <text x="760" y="81">Dec</text>
    <text x="856" y="81">Jan</text>
    <text x="952" y="81">Feb</text>
    <text x="1048" y="81">Mar</text>
    <text x="1144" y="81">Apr</text>
    <text x="1240" y="81">May</text>
    <text x="1336" y="81">Jun</text>
    <text x="1432" y="81">Jul</text>
    <text x="1528" y="81">Aug</text>
    <text x="1624" y="81">Sep</text>
  </g>
  <path d="M280 104H1624M280 104V114M376 104V114M472 104V114M568 104V114M664 104V114M760 104V114M856 104V114M952 104V114M1048 104V114M1144 104V114M1240 104V114M1336 104V114M1432 104V114M1528 104V114M1624 104V114" fill="none" stroke="#a9b7be"/>

  <text class="row-label" x="64" y="186">Specification release</text>
  <text class="row-name" x="64" y="219">March</text>
  <rect x="280" y="172" width="192" height="76" fill="#e2eef3" stroke="#6f8f9c"/>
  <text class="phase" x="376" y="210">Planning</text>
  <rect x="472" y="172" width="336" height="76" fill="#eef3f5" stroke="#8a9ea8"/>
  <text class="phase" x="640" y="210">Core Maintainer review</text>
  <use href="#freeze" x="808" y="172"/>

  <path d="M856 248V416M1048 248V416" fill="none" stroke="#8ea3ad" stroke-opacity="0.65" stroke-dasharray="3 5"/>
  <path d="M856 330H1048" stroke="#6f8b98" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
  <text class="dimension" x="952" y="312">2-month overlap</text>

  <text class="row-label" x="64" y="430">Specification release</text>
  <text class="row-name" x="64" y="463">September</text>
  <rect x="856" y="416" width="192" height="76" fill="#e2eef3" stroke="#6f8f9c"/>
  <text class="phase" x="952" y="454">Planning</text>
  <rect x="1048" y="416" width="336" height="76" fill="#eef3f5" stroke="#8a9ea8"/>
  <text class="phase" x="1216" y="454">Core Maintainer review</text>
  <use href="#freeze" x="1384" y="416"/>

  <path d="M1048 492V588M1624 492V588" fill="none" stroke="#8ea3ad" stroke-opacity="0.65" stroke-dasharray="3 5"/>
  <path d="M1048 578H1624" stroke="#6f8b98" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
  <text class="dimension" x="1336" y="560">6 months between releases</text>
</svg>
