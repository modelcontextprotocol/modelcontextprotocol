<svg xmlns="http://www.w3.org/2000/svg" width="400" height="552" viewBox="0 0 400 552" role="img" aria-labelledby="title description">
  <title id="title">Formal SEP review timeline</title>
  <desc id="description">Two weeks before the meeting, release managers publish the agenda and proposal links and invite authors and group representatives. During the preceding week, reviewers comment on the pull request and authors and sponsors respond. At the meeting, presenters discuss the proposal, open questions, and implementation feedback. After the presentation, the sponsor opens a vote that lasts seven calendar days.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; fill: #e6ecef; }
      .time { font-weight: 600; dominant-baseline: central; }
      .number { font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .card { fill: #202a31; stroke: #728c9a; }
      .vote { fill: #282b28; stroke: #b6a879; }
      .badge { fill: #203038; stroke: #809eaa; }
      .connector { fill: none; stroke: #8aa8b8; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path class="connector" d="M0 0L8 4L0 8"/>
    </marker>
  </defs>

  <rect width="400" height="552" fill="#141c22"/>

  <g>
    <rect class="card" x="16" y="20" width="368" height="110" rx="8"/>
    <circle class="badge" cx="40" cy="50" r="14"/>
    <text class="number" x="40" y="50">1</text>
    <text class="time" x="64" y="50">2 weeks before the meeting</text>
    <text x="40" y="84">Publish agenda and proposal links.</text>
    <text x="40" y="108">Invite authors and representatives.</text>
  </g>

  <path class="connector" d="M200 130V150" marker-end="url(#arrow)"/>

  <g transform="translate(0 134)">
    <rect class="card" x="16" y="20" width="368" height="110" rx="8"/>
    <circle class="badge" cx="40" cy="50" r="14"/>
    <text class="number" x="40" y="50">2</text>
    <text class="time" x="64" y="50">Week before the meeting</text>
    <text x="40" y="84">Reviewers comment on the PR.</text>
    <text x="40" y="108">Authors and sponsors respond.</text>
  </g>

  <path class="connector" d="M200 264V284" marker-end="url(#arrow)"/>

  <g transform="translate(0 268)">
    <rect class="card" x="16" y="20" width="368" height="110" rx="8"/>
    <circle class="badge" cx="40" cy="50" r="14"/>
    <text class="number" x="40" y="50">3</text>
    <text class="time" x="64" y="50">At the meeting</text>
    <text x="40" y="84">Present the proposal,</text>
    <text x="40" y="108">open questions, and feedback.</text>
  </g>

  <path class="connector" d="M200 398V418" marker-end="url(#arrow)"/>

  <g transform="translate(0 402)">
    <rect class="vote" x="16" y="20" width="368" height="110" rx="8"/>
    <circle class="badge" cx="40" cy="50" r="14"/>
    <text class="number" x="40" y="50">4</text>
    <text class="time" x="64" y="50">After the presentation</text>
    <text x="40" y="84">The sponsor opens a vote.</text>
    <text x="40" y="108">Voting lasts 7 calendar days.</text>
  </g>
</svg>
