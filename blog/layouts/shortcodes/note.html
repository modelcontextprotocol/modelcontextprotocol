{{- $title := .Get "title" | default "Note" -}}
{{- $id := printf "note-%d" .Ordinal -}}
<aside class="mcp-note" role="note" aria-labelledby="{{ $id }}">
  <div class="mcp-note-header">
    <svg class="mcp-note-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4M12 8h.01" />
    </svg>
    <p class="mcp-note-title" id="{{ $id }}">{{ $title }}</p>
  </div>
  <div class="mcp-note-content">{{ .Page.RenderString (dict "display" "block") (trim .Inner " \n") }}</div>
</aside>
