{{- partial "post_when.html" (dict "page" . "format" (default "Jan 2, 2006" site.Params.DateFormat)) }}
{{- if not (.Param "hideAuthor") }}
{{- with (partial "authors.html" .) }}
<ul class="authors">
  {{- range . }}
  <li class="author">
    <span class="author-name">{{ .name }}</span>
    {{- with .role }} <span class="author-role">{{ . }}</span>{{ end }}
  </li>
  {{- end }}
</ul>
{{- end }}
{{- end -}}
