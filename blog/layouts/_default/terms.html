{{- define "main" }}

<header class="page-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . }}</div>
  {{- end }}
</header>

<ul class="terms-tags">
  {{- range .Data.Terms.Alphabetical }}
  <li>
    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="tag-count">{{ len .Page.RegularPages }}</span></a>
  </li>
  {{- end }}
</ul>

{{- end }}{{/* end main */ -}}
