{{- define "main" }}

<header class="page-header">
    {{- partial "breadcrumbs.html" . }}
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
</header>

<div id="searchbox">
    <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default .Title }}"
        aria-label="Search posts" type="search" autocomplete="off" maxlength="64" data-index="{{ "index.json" | relURL }}">
    <p id="searchStatus" role="status" aria-live="polite"></p>
    <ul id="searchResults" aria-label="search results"></ul>
</div>

{{- end }}{{/* end main */}}
